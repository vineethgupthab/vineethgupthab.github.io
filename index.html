<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test HTML Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
            text-align: center;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Hello HTML 🚀</h1>
        <p>This is a test HTML page.</p>

        <input id="name" type="text" placeholder="Enter your name">

        <br><br>

        <button onclick="sayHello()">Click Me</button>

        <p id="message"></p>
    </div>


    <script>
        function sayHello() {
            const name = document.getElementById("name").value;

            if (name) {
                document.getElementById("message").innerHTML =
                    "Hello, " + name + "! 🎉";
            } else {
                document.getElementById("message").innerHTML =
                    "Please enter your name.";
            }
        }
    </script>

</body>
</html>
